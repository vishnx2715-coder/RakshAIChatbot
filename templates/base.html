<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RAKSHA — National Disaster Intelligence Platform</title>
<meta name="google-signin-client_id" content="{{ google_client_id }}"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Leaflet CSS — free OpenStreetMap tiles, no API key needed -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/static/enhance.css"/>
<link rel="stylesheet" href="/static/chatbot.css"/>
<link rel="stylesheet" href="/static/landing.css"/>
<link rel="stylesheet" href="/static/responsive.css"/>
<!-- Extracted from inline <style> — Phase 5 refactor -->
<link rel="stylesheet" href="/static/css/main.css"/>
{% block head_extra %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}

<!-- External JS libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/enhance.js"></script>

<!-- Runtime config injected by Flask (never put secrets in JS files) -->
<script>
window.RAKSHA_CONFIG = {
  owmKey:         "{{ owm_key }}",
  googleClientId: "{{ google_client_id }}",
  googleMapsKey:  "{{ google_maps_key }}"
};
</script>

{% block scripts %}
<!-- Page-specific JS loaded here -->
<script src="/static/js/main.js"></script>
{% endblock %}
</body>
</html>
